name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (compile, test, ABI freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A transitive dependency (@zksync/contracts → era-contracts) is pinned as
      # a git+ssh GitHub URL; runners have no SSH key, so rewrite to anonymous
      # HTTPS before install or npm ci fails cloning it.
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install root dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm test

      # Re-extract ABIs from fresh artifacts and fail if the committed copies
      # under backend/abis/ are stale — guards against indexer/ABI drift (#1).
      - name: Check committed ABIs are fresh
        run: npm run abis:check

  backend:
    name: Backend (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # Generate the Prisma client so @prisma/client types resolve for tsc.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # DB-backed integration tests skip automatically when DATABASE_URL is
      # unset; unit tests run unconditionally.
      - name: Test
        run: npm test
